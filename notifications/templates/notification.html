<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trigger Notification</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input { display: block; margin-bottom: 10px; padding: 8px; width: 300px; }
    </style>
</head>
<body>
    <h3>Send a Test Notification</h3>
    <form method="post">
        {% csrf_token %}
        <label>Notification Text:</label>
        <input type="text" name="notification_text" placeholder="e.g. Someone liked your post!" required>
        
        <label>Target User ID:</label>
        <input type="text" name="user" placeholder="Enter User ID (e.g. 1)" required>
        
        <input type="submit" value="Send Notification">
    </form>
</body>
</html>
